name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [dev, sit, main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest
    steps:
      - name: Check source -> target branch is allowed
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "PR: $HEAD_REF -> $BASE_REF"
          case "$BASE_REF" in
            dev)
              [[ "$HEAD_REF" =~ ^(feature/|feat-|bugfix/|fix/|hotfix/) ]] && exit 0
              echo "::error::Only feature/*, feat-*, bugfix/*, fix/* or hotfix/* branches can merge into dev." ;;
            sit)
              [[ "$HEAD_REF" == "dev" || "$HEAD_REF" =~ ^hotfix/ ]] && exit 0
              echo "::error::Only dev (or hotfix/*) can merge into sit." ;;
            main)
              [[ "$HEAD_REF" == "sit" || "$HEAD_REF" =~ ^hotfix/ ]] && exit 0
              echo "::error::Only sit (or hotfix/*) can merge into main." ;;
          esac
          exit 1

  lint-and-typecheck:
    name: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
        
      - name: Install dependencies
        id: install
        run: npm ci

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx expo lint

      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit